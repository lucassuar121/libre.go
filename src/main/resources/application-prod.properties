# ===== PERFIL DE PRODUCCIÓN (SPRING_PROFILES_ACTIVE=prod) =====
# Todo sale de variables de entorno. Si falta una obligatoria, la aplicación NO arranca y lo dice en el log.

# --- Base de datos PostgreSQL (obligatorias) ---
# Ejemplo de DB_URL: jdbc:postgresql://HOST:5432/librego
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Conexiones por instancia (cuidado con el límite de conexiones de tu base si Cloud Run crea varias instancias)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# update crea/agrega tablas y columnas sin borrar datos. Si preferís no tocar el esquema automáticamente: DDL_AUTO=none
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# --- Detrás del proxy HTTPS de Cloud Run ---
# Para que la app vea la IP y el protocolo reales (límites de intentos, cookie segura, HSTS)
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*
# La cookie de sesión solo viaja por HTTPS
server.servlet.session.cookie.secure=true

# --- Logs: sin contenido de emails ni datos sensibles ---
app.mail.log-content=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

async function doSignupRegister(){const counters=Math.max(1,Math.min(50,Math.floor(Number($('#scounters')?.value||1)))),cashBalances=Array.from(document.querySelectorAll('.scashbalance')).map(x=>Number(x.value||0));if(cashBalances.length!==counters||cashBalances.some(x=>!Number.isFinite(x)||x<0)){const el=$('#signuperr');if(el)el.textContent='Revisá el saldo inicial de cada mostrador.';return}const b={token:CONTRATACION,company:$('#sco').value.trim(),name:$('#sname').value.trim(),username:$('#suser').value.trim(),email:$('#semail').value.trim(),password:$('#spass').value,counters,cashBalances};try{const d=await api('public/signup/register','POST',b);CONTRATACION=null;try{localStorage.removeItem('lg_signup')}catch(e){}history.replaceState(null,'',location.pathname);setD(d);toast('Cuenta creada. ¡Bienvenido a Libre.go!')}catch(x){const el=$('#signuperr');if(el)el.textContent=x.message}}
function authView(){if(CONTRATACION)return signupView();if(!RT&&scr=='land')return landView();if(!RT&&scr=='contact')return contactView();const t=RT?'reset':am;

function gate(){modal('Fichar entrada',`<p style="color:var(--mut)">Antes de empezar, elegí el mostrador y contá el efectivo real que queda en la caja. Si no coincide con el cierre anterior, el sistema avisará al jefe.</p><label>Mostrador N°</label><select id="gc">${Array.from({length:Math.max(1,Math.min(50,Number(D.counterConfig?.counters||1)))},(_,i)=>`<option value="${i+1}">Mostrador ${i+1}</option>`).join('')}</select><label>Saldo inicial contado en efectivo ($, solo números enteros)</label><input id="gopening" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="off" placeholder="Ej. 25000"><small style="color:var(--mut)">El monto que ingreses será el saldo inicial real de este turno.</small>${tdSel((curDef()||{}).id)}`,async()=>{const raw=$('#gopening').value;if(!/^\d+$/.test(raw)){toast('Ingresá el saldo inicial usando solo números enteros.',1);return false}const r=await api('shift/start','POST',{counter:+$('#gc').value,openingCash:+raw,shiftDefId:$('#gt')?+$('#gt').value:undefined});await load();toast(Math.abs(Number(r.openingDifference||0))>0?'Entrada registrada: hay una diferencia con el cierre anterior; se avisó al jefe.':'Entrada registrada.');},'Fichar entrada',1)}
function endShift(){const sh=D.shifts.find(x=>x.id==D.openShift.id);const c=sh.cash||{};
 modal('Fichar salida y cerrar caja',`<p style="color:var(--mut)">Contá el efectivo real y cargá los importes cobrados por cada medio. LibreGo los compara automáticamente con las ventas, compras y retiros registrados; no tenés que declarar faltantes ni sobrantes.</p><div class="card"><b>Saldo inicial:</b> ${$$(sh.openingCash||0)}</div><label>Saldo final contado en efectivo ($)</label><input id="ecash" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="off"><label>Total cobrado en tarjeta ($)</label><input id="ecard" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="off"><label>Total cobrado por QR ($)</label><input id="eqr" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="off"><label>Total cobrado por transferencia ($)</label><input id="etransfer" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="off"><small style="color:var(--mut)">El efectivo final pasa a ser el saldo inicial del próximo turno de este mostrador. El sistema detecta diferencias por separado para efectivo, tarjeta, QR y transferencia.</small>`,async()=>{const fields=[['ecash','saldo final en efectivo'],['ecard','total de tarjeta'],['eqr','total de QR'],['etransfer','total de transferencia']];for(const [id,label] of fields)if(!/^\d+$/.test($('#'+id).value)){toast('Ingresá el '+label+' usando solo números enteros.',1);return false}const closed=await api('shift/end','POST',{finalCash:+$('#ecash').value,cardCollected:+$('#ecard').value,qrCollected:+$('#eqr').value,transferCollected:+$('#etransfer').value});await load();closeReceipt(closed);return false},'Confirmar cierre')}
function closeReceipt(sh,finalize=true){const money=n=>$$(Number(n||0)),diff=(key)=>Number(sh[key]||0),line=(name,expected,actual,difference)=>`<tr><td>${name}</td><td>${money(expected)}</td><td>${money(actual)}</td><td style="color:${Math.abs(Number(difference||0))>0?'var(--bad)':'inherit'}">${money(difference)}</td></tr>`;modal('Comprobante de cierre de caja',`<div class="tkt"><h3 style="text-align:center">${e(D.company)}</h3><h4 style="text-align:center;margin:4px 0">COMPROBANTE DE CIERRE DE CAJA</h4><hr><div>Empleado: ${e(sh.user)}</div><div>Usuario: ${e(D.me.username||D.me.name)}</div><div>Mostrador: ${e(sh.counter)} · Turno: ${e(sh.shiftName||'—')}</div><div>Inicio: ${fdt(sh.start)} · Cierre: ${fdt(sh.end)}</div><hr><div>Saldo inicial contado: ${money(sh.openingCash)}</div><div>Saldo que se esperaba al iniciar: ${money(sh.expectedOpeningCash)}</div><div>Diferencia de apertura: ${money(sh.openingDifference)}</div><div>Saldo final contado: ${money(sh.finalCash)}</div><div>Efectivo esperado al cierre: ${money(sh.expectedFinalCash)}</div><div>Total vendido: ${money(sh.totalSold)} · Cantidad de ventas: ${e(sh.salesCount||0)}</div><div>Ventas en efectivo: ${money(sh.cashSales)} · Compras pagadas en efectivo: ${money(sh.cashPurchases)} · Retiros: ${money(sh.cashWithdrawals)}</div><hr><table style="min-width:0"><thead><tr><th>Concepto</th><th>Esperado</th><th>Contado/declarado</th><th>Diferencia</th></tr></thead><tbody>${line('Efectivo al cierre',sh.expectedFinalCash,sh.finalCash,sh.diffCash)}${line('Tarjeta',sh.expectedCard,sh.declaredCard,sh.diffCard)}${line('QR',sh.expectedQr,sh.declaredQr,sh.diffQr)}${line('Transferencia',sh.expectedTransfer,sh.declaredTransfer,sh.diffTransfer)}</tbody></table><hr><div><b>Diferencia absoluta total: ${money(sh.diffTotal)}</b></div><b>Estado: ${sh.cashReconciled?'Caja conciliada':'REVISAR DIFERENCIAS'}</b><div>Emitido: ${fdt(new Date().toISOString())}</div></div><div class="ra noprint">${finalize?`<button class="bt" data-a="logoutclose">Finalizar sin imprimir</button><button class="bt p" data-a="printclose">Imprimir comprobante y finalizar</button>`:`<button class="bt" data-a="close">Cerrar</button><button class="bt p" data-a="print">Imprimir comprobante</button>`}</div>`,null,0,2);window.__closedShift=sh}

const barcodeKey=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');

  const supported=await BarcodeDetector.getSupportedFormats();const formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(f=>supported.includes(f));if(!formats.length)throw new Error('El navegador no reconoce formatos de códigos de barras');const detector=new BarcodeDetector({formats});
  barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  const video=$('#barcodevideo');if(!video){stopBarcodeCamera();return}video.srcObject=barcodeStream;await video.play();barcodeActive=true;barcodeBusy=false;
  const scan=async()=>{if(!barcodeActive||!video.isConnected)return;if(!barcodeBusy){barcodeBusy=true;try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){const code=codes[0].rawValue;stopBarcodeCamera();handleBarcode(code);return}}catch(err){}finally{barcodeBusy=false}}if(barcodeActive)requestAnimationFrame(scan)};
  requestAnimationFrame(scan);
 }catch(err){stopBarcodeCamera();toast('No se pudo abrir la cámara. Revisá los permisos del navegador o usá un lector USB/Bluetooth.',1)}
}

document.addEventListener('input',ev=>{const g=ev.target.id;if(g=='scounters')signupCounterFields();if(g=='q'){q=ev.target.value;tb()}if(g=='clq'){clq=ev.target.value;const pos=ev.target.selectionStart;render();const inp=$('#clq');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}if(g=='ps')fillRes();if(g=='cs')fillCs();if(g=='bq'||g=='bp')boxTot();if(g=='ssq'){ssq=ev.target.value;spl()}if(g=='pfn2'){pn=ev.target.value;purTb()}if(g=='pps')purRes();if(g=='mbq'){if($('#mb'))$('#mb').value='';if($('#mbselected'))$('#mbselected').textContent='Todavía no seleccionaste un producto.';moveProdRes()}if(g=='pfsq'){psupplierQ=ev.target.value;const sel=D.suppliers.find(x=>String(x.id)==String(pf.s));if(!sel||sel.name!==psupplierQ.trim())pf.s='';purSupplierRes()}if(g=='sq'){sq=ev.target.value;stk()}if(g=='mfq'){mfq=ev.target.value;mvs()}});
document.addEventListener('change',ev=>{if(ev.target.id=='mfd'){mfd=ev.target.value;mvs()}if(ev.target.id=='cfd'){cfd=ev.target.value;render()}if(ev.target.id=='pfd2'){pd=ev.target.value;purTb()}if(ev.target.id=='pfs2'){ps2=ev.target.value;purTb()}if(ev.target.dataset&&ev.target.dataset.pq!==undefined){pcart[+ev.target.dataset.pq].q=ev.target.value;purForm()}if(ev.target.dataset&&ev.target.dataset.pu!==undefined){pcart[+ev.target.dataset.pu].perBox=ev.target.value;purForm()}if(ev.target.dataset&&ev.target.dataset.pp!==undefined){pcart[+ev.target.dataset.pp].price=ev.target.value;purForm()}{const id=ev.target.id,v=ev.target.value;if(id=='sfd'){sfd=v;render()}else if(id=='sft'){sft=v;render()}else if(id=='sfc'){sfc=v;render()}else if(id=='sdv'){sv[sp]=v;render()}else if(id=='stn'){stn=+v;render()}}if(ev.target.dataset&&ev.target.dataset.ci!==undefined)setQty(+ev.target.dataset.ci,ev.target.value);if(ev.target.id=='mft'){mft=ev.target.value;mvs()}if(ev.target.id=='mty')$('#mql').textContent=ev.target.value=='ajuste'?'Stock real (cantidad contada)':'Cantidad';if(ev.target.id=='mty'){const en=ev.target.value=='entrada';$('#bmw').style.display=en?'':'none';if(!en)setBm('u')}if(ev.target.id=='ce'){const c=D.clients.find(x=>(x.email||'').toLowerCase()==ev.target.value.trim().toLowerCase());if(c){const n=(c.name||'').split(' ');if(!$('#cf').value)$('#cf').value=c.firstName||n[0]||'';if(!$('#cl').value)$('#cl').value=c.lastName||n.slice(1).join(' ')}}if(ev.target.id=='tp'){tp=ev.target.value;tb()}if(ev.target.id=='lf'){lf=ev.target.value;render()}if(ev.target.id=='lfd'){lfd=ev.target.value;render()}if(ev.target.id=='lfh'){lfh=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='barcodeInput'){ev.preventDefault();const code=ev.target.value.trim();if(code&&handleBarcode(code)){ev.target.value='';}}if(ev.key=='Enter'&&ev.target.id=='ps'){const f=document.querySelector('.qa');if(f){ev.preventDefault();f.focus();f.select()}}if(ev.key=='Enter'&&ev.target.classList&&ev.target.classList.contains('qa')){ev.preventDefault();addCart(ev.target.dataset.p,ev.target.value)}if(ev.key=='Enter'&&ev.target.closest('.auth')&&ev.target.tagName=='INPUT'){if(CONTRATACION)doSignupRegister();else if(!RT&&scr=='contact')doCheckout();else doAuth()}});

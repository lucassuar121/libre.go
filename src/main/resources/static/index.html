<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libre.go</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1b2a2a;--mut:#5d6f6e;--line:#dce3e2;--pri:#0f4c4a;--pri2:#e3efee;--acc:#c58b2a;--bad:#b3392f;--side:#0f3a38}
@media (prefers-color-scheme:dark){:root{--bg:#0e1716;--card:#162322;--ink:#e6efee;--mut:#9ab0ae;--line:#274140;--pri:#5fc4bd;--pri2:#1d3533;--acc:#e0aa4c;--bad:#ef7d72;--side:#0a1211}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--side);color:#dfeceb;padding:20px 12px;display:flex;flex-direction:column;gap:4px;z-index:5;transition:transform .2s;overflow:auto}
aside h1{font-size:26px;padding:0 10px 18px;color:#fff}aside h1 span{color:var(--acc)}
.nv{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
.nv:hover{background:#ffffff14}.nv.on{background:var(--acc);color:#1b1405;font-weight:700}
main{margin-left:230px;padding:24px;max-width:1150px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.top h2{font-size:28px;flex:1}
#bg{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kp .card{margin:0}.kp b{display:block;font-size:21px;font-family:Georgia,serif}.kp small{color:var(--mut)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:13px}
.bt{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.bt.p{background:var(--pri);color:#fff;border-color:var(--pri)}.bt.d{color:var(--bad)}.bt.s{padding:4px 10px;font-size:13px}.bt:disabled{opacity:.6}
@media (prefers-color-scheme:dark){.bt.p{color:#07201f}}
.bt:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lk{background:none;border:0;color:var(--pri);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:140px;width:auto}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--pri2);color:var(--pri);white-space:nowrap}.tag.w{background:#c58b2a33;color:var(--acc)}.tag.b{background:#b3392f22;color:var(--bad)}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.md label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}.ra{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.hb i{display:block;height:10px;border-radius:5px;background:var(--pri)}.hb span{min-width:120px}
.em{color:var(--mut);padding:18px;text-align:center}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.auth .md{max-width:400px}
.out aside,.out main{display:none}
.ts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw}.ts.bad{background:var(--bad);color:#fff}
.tkt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px dashed var(--line);padding:14px;background:#fff;color:#111}
.tkt hr{border:0;border-top:1px dashed #999;margin:8px 0}.tkt table{min-width:0}.tkt th,.tkt td{padding:3px 2px;border:0;color:#111;font-size:12px}.tkt th{color:#555}
.tkt .tr{display:flex;justify-content:space-between;font-size:16px;font-weight:700}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:16px}#bg{display:inline-block}.g2{grid-template-columns:1fr}}
@media print{aside,main,#au,.noprint,.ts{display:none!important}body{background:#fff}.ov{position:static;background:none;padding:0;display:block}.md{box-shadow:none;max-width:none;max-height:none;overflow:visible;padding:0;background:#fff}.md>h3{display:none}.tkt{border:0}}
</style></head><body>
<aside id="sd"><h1>Libre<span>.go</span></h1>
<button class="nv" data-a="nav" data-i="dash">Panel</button><button class="nv" data-a="nav" data-i="products">Productos</button><button class="nv" data-a="nav" data-i="sales">Ventas</button><button class="nv" data-a="nav" data-i="stock">Stock</button><button class="nv" data-a="nav" data-i="caja">Caja</button><button class="nv" data-a="nav" data-i="clients">Clientes</button><button class="nv" data-a="nav" data-i="suppliers">Proveedores</button><button class="nv jf" data-a="nav" data-i="stats">Estadísticas</button><button class="nv jf" data-a="nav" data-i="team">Equipo y actividad</button>
<div id="me" style="margin-top:auto;padding:10px;font-size:13px"></div></aside>
<main><div class="top"><button class="bt" id="bg" data-a="menu" aria-label="Abrir menú">☰</button><h2 id="ttl"></h2><span id="act"></span></div><div id="v"></div></main>
<div id="m"></div><div id="au"></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const fdt=t=>t?new Date(t).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'—',fh=t=>t?new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'—',dk=t=>new Date(t).toLocaleDateString('en-CA');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),MT={entrada:'Entrada de mercadería',venta:'Salida por venta',salida:'Salida',ajuste:'Ajuste de stock',devolucion:'Devolución',in:'Entrada',out:'Salida'};
const pad=n=>String(n).padStart(5,'0'),MIN=5,PAY={efectivo:'Efectivo',tarjeta:'Tarjeta',qr:'QR'};
const T={dash:'Panel',products:'Productos',sales:'Ventas',stock:'Stock',caja:'Caja',clients:'Clientes',suppliers:'Proveedores',stats:'Estadísticas',team:'Equipo y actividad'};
let D=null,view='dash',am='login',q='',tp='',lf='',cart=[],pay='',scl='',ct='nuevo',cid=null,csq='',cu={fn:'',ln:'',em:''},psq='',GC=null,stab='stock',sq='',mfq='',mft='',RT=new URLSearchParams(location.search).get('reset');
const JF=()=>D.me.role=='jefe',pr=id=>D.products.find(p=>p.id==id)||{title:'(eliminado)',sellPrice:0,stock:0};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',...(GC?{'X-Company':GC}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(x){}if(!r.ok){const er=new Error(j.message||'Ocurrió un error. Probá de nuevo.');er.st=r.status;throw er}return j}
function toast(t,bad){const d=document.createElement('div');d.className='ts'+(bad?' bad':'');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3800)}
function setD(d){['sales','moves','shifts'].forEach(k=>(d[k]=d[k]||[]).sort((a,b)=>b.id-a.id));D=d;render()}
async function load(){try{setD(await api('bootstrap'))}catch(x){if(GC&&x.st!=401){GC=null;return load()}D=null;render()}}
const run=async(f,ok)=>{try{await f();if(ok)toast(ok)}catch(x){if(x.st==401){D=null;render()}toast(x.message,1)}};
function modal(t,body,ok,label,mode){$('#m').innerHTML=`<div class="ov"><div class="md" role="dialog" aria-label="${e(t)}"><h3>${e(t)}</h3>${body}${mode==2?'':`<div class="ra noprint">${mode==1?'':`<button class="bt" data-a="close">${ok?'Cancelar':'Cerrar'}</button>`}${ok?`<button class="bt p" id="ok">${label||'Guardar'}</button>`:''}</div>`}</div></div>`;
 if(ok)$('#ok').onclick=async()=>{const b=$('#ok');b.disabled=true;try{if(await ok()!==false)$('#m').innerHTML=''}catch(x){if(x.st==401){D=null;render()}else toast(x.message,1)}if(b.isConnected)b.disabled=false}}
const ask=(t,f)=>modal('Confirmar',`<p>${e(t)}</p>`,f,'Sí, eliminar');
const wl=u=>{u=(u||'').trim();if(!u)return '—';const h=/^https?:\/\//i.test(u)?u:'https://'+u;return `<a href="${e(h)}" target="_blank" rel="noopener noreferrer">${e(u)}</a>`};
const table=(h,rows,empty)=>rows.length?`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:`<div class="em">${empty}</div>`;
const acts=(k,id,del=1)=>`<button class="bt s" data-a="edit" data-k="${k}" data-i="${id}">Editar</button>${del?` <button class="bt s d" data-a="del" data-k="${k}" data-i="${id}">Eliminar</button>`:''}`;
const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0),prof=l=>sum(l,s=>sum(s.items,i=>(i.price-(i.cost||0))*i.qty)),low=()=>D.products.filter(p=>p.stock<=MIN);
const kp=a=>`<div class="kp">${a.map(x=>`<div class="card"><small>${x[0]}</small><b${x[2]?` style="color:${x[2]}"`:''}>${x[1]}</b></div>`).join('')}</div>`;
const cajaK=sh=>{const c=sh.cash,d=sh.end?sh.diff||0:0;return kp([['Total vendido',$$(c.sold)],['Cobrado en efectivo',$$(c.cash)],['Cobrado con tarjeta',$$(c.card)],['Cobrado con QR',$$(c.qr)],['Ventas realizadas',c.count],['Faltante / sobrante',sh.end?(d==0?'Sin diferencia':(d>0?'Sobrante ':'Faltante ')+$$(Math.abs(d))):'Se carga al cerrar',d<0?'var(--bad)':''],['Total general de la caja',$$(c.sold+d)]])};
const salesTable=(l,tk=1)=>table(['N°','Fecha y hora','Cliente','Empleado','Pago','Total',''],l.map(s=>`<tr><td>#${pad(s.number)}</td><td>${fdt(s.at)}</td><td>${e(s.clientName)}</td><td>${e(s.user)}${s.counter?`<br><small>Mostrador ${s.counter}</small>`:''}</td><td>${PAY[s.payment]||''}</td><td>${$$(s.total)}</td><td>${tk?`<button class="bt s" data-a="tk" data-i="${s.id}">Ver ticket</button>`:''}</td></tr>`),'Todavía no hay ventas.');

function render(){
 if(!D){document.body.classList.add('out');$('#m').innerHTML='';return authView()}
 document.body.classList.remove('out');$('#au').innerHTML='';
 if(D.me.role=='global'&&!GC){document.querySelectorAll('.nv').forEach(n=>n.style.display='none');$('#ttl').textContent='Administración Global';$('#act').innerHTML='';$('#me').innerHTML=meBox();$('#v').innerHTML=gview();return}
 const jf=JF(),os=D.openShift;
 if(!jf&&(view=='stats'||view=='team'))view='dash';
 document.querySelectorAll('.nv').forEach(n=>{n.classList.toggle('on',n.dataset.i==view);n.style.display=n.classList.contains('jf')&&!jf?'none':''});
 $('#ttl').textContent=T[view]+(GC?' · '+D.company:'');
 $('#me').innerHTML=meBox();
 const A={products:'<button class="bt p" data-a="add" data-k="products">Nuevo producto</button>',clients:'<button class="bt p" data-a="add" data-k="clients">Nuevo cliente</button>',suppliers:'<button class="bt p" data-a="add" data-k="suppliers">Nuevo proveedor</button>',sales:'<button class="bt p" data-a="sale">Nueva venta</button>',stock:'<button class="bt" data-a="move">Movimiento de stock</button> <button class="bt p" data-a="add" data-k="products">Ingresar producto nuevo</button>',team:jf?'<button class="bt p" data-a="nu">Nuevo usuario</button>':''};
 $('#act').innerHTML=A[view]||'';
 const V=$('#v');
 if(view=='dash'){const td=dk(Date.now()),mo=td.slice(0,7),st=D.sales.filter(s=>dk(s.at)==td),sm=D.sales.filter(s=>dk(s.at).slice(0,7)==mo),L=low();
  const k=[['Ventas de hoy',st.length],['Productos',D.products.length],['Con poco stock',L.length,'var(--bad)']];
  if(jf)k.push(['Ingresos del mes',$$(sum(sm,s=>s.total))],['Ganancia del mes',$$(prof(sm))]);
  const days=[...Array(14)].map((_,i)=>{const d=dk(Date.now()-(13-i)*864e5);return{d,v:sum(D.sales.filter(s=>dk(s.at)==d),s=>s.total)}}),mx=Math.max(1,...days.map(x=>x.v)),on=D.shifts.filter(s=>!s.end);
  V.innerHTML=kp(k)+`<div class="${jf?'g2':''}">${jf?`<div class="card"><h3>Ingresos de los últimos 14 días</h3><svg viewBox="0 0 280 120" width="100%" role="img" aria-label="Ingresos diarios">${days.map((x,i)=>`<rect x="${i*20+3}" y="${110-x.v/mx*100}" width="14" height="${x.v/mx*100}" rx="3" fill="var(--pri)"><title>${x.d}: ${$$(x.v)}</title></rect>`).join('')}<line x1="0" x2="280" y1="110" y2="110" stroke="var(--line)"/></svg></div>`:''}<div class="card"><h3>Alertas de stock</h3>${L.length?L.map(p=>`<div class="hb"><span style="flex:1">${e(p.title)}</span><span class="tag ${p.stock==0?'b':'w'}" style="min-width:0">${p.stock} u.</span></div>`).join(''):'<div class="em">Todo el stock está al día.</div>'}</div></div>${jf?`<div class="card"><h3>Ahora en turno</h3>${on.length?on.map(s=>`<div class="hb"><span style="flex:1">${e(s.user)}</span>Mostrador ${s.counter} · desde ${fh(s.start)}</div>`).join(''):'<div class="em">Nadie fichó la entrada.</div>'}</div>`:''}<div class="card"><h3>Últimas ventas</h3>${salesTable(D.sales.slice(0,5),0)}</div>`}
 if(view=='products'){V.innerHTML=`<div class="card"><div class="bar"><input id="q" placeholder="Buscar por nombre, autor o código" value="${e(q)}"><select id="tp"><option value="">Todos los tipos</option><option value="libro" ${tp=='libro'?'selected':''}>Libros</option><option value="otro" ${tp=='otro'?'selected':''}>Otros productos</option></select></div><div id="tb"></div></div>`;tb()}
 if(view=='clients')V.innerHTML=`<div class="card">${table(['Nombre','Email','Teléfono','Compras',''],D.clients.map(c=>{const s=D.sales.filter(x=>x.clientId==c.id);return`<tr><td><b>${e(c.name)}</b></td><td>${e(c.email)}</td><td>${e(c.phone)}</td><td>${s.length}${jf?' · '+$$(sum(s,x=>x.total)):''}</td><td>${acts('clients',c.id)}</td></tr>`}),'Todavía no cargaste clientes.')}</div>`;
 if(view=='suppliers')V.innerHTML=`<div class="card">${table(['Proveedor','Contacto','Teléfono','Email','Página web',''],D.suppliers.map(c=>`<tr><td><b>${e(c.name)}</b></td><td>${e(c.contact)}</td><td>${e(c.phone)}</td><td>${e(c.email)}</td><td>${wl(c.website)}</td><td>${acts('suppliers',c.id)}</td></tr>`),'Todavía no cargaste proveedores.')}</div>`;
 if(view=='sales')V.innerHTML=`<div class="card">${salesTable(D.sales)}</div>`;
 if(view=='stock'){const L=low();V.innerHTML=`<div class="bar"><button class="bt ${stab=='stock'?'p':''}" data-a="stab" data-i="stock">Stock actual</button><button class="bt ${stab=='moves'?'p':''}" data-a="stab" data-i="moves">Movimientos</button></div>`+(stab=='stock'?`<div class="card"><h3>Poco stock (${MIN} o menos)</h3>${L.length?table(['Producto','Stock'],L.map(p=>`<tr><td>${e(p.title)}</td><td><span class="tag ${p.stock==0?'b':'w'}">${p.stock}</span></td></tr>`),''):'<div class="em">No hay alertas.</div>'}</div><div class="card"><div class="bar"><input id="sq" placeholder="Buscar producto por nombre o código" value="${e(sq)}"></div><div id="st"></div></div>`:`<div class="card"><h3>Movimientos de stock</h3><div class="bar"><input id="mfq" placeholder="Buscar producto" value="${e(mfq)}"><select id="mft"><option value="">Todos los tipos</option>${['entrada','venta','salida','ajuste','devolucion'].map(k=>`<option value="${k}" ${mft==k?'selected':''}>${MT[k]}</option>`).join('')}</select></div><div id="mv"></div></div>`);if(stab=='stock')stk();else mvs()}
 if(view=='caja'){const cs=D.openShift&&D.shifts.find(s=>s.id==D.openShift.id),tdS=D.shifts.filter(s=>dk(s.start)==dk(Date.now())),ag={end:1,diff:sum(tdS,s=>s.diff||0),cash:{sold:sum(tdS,s=>s.cash.sold),cash:sum(tdS,s=>s.cash.cash),card:sum(tdS,s=>s.cash.card),qr:sum(tdS,s=>s.cash.qr),count:sum(tdS,s=>s.cash.count)}};
  const row=s=>{const c=s.cash,d=s.diff||0;return`<tr><td>${e(s.user)}</td><td>${s.counter}</td><td>${fdt(s.start)}</td><td>${s.end?fdt(s.end):'<span class="tag w">En curso</span>'}</td><td>${c.count}</td><td>${$$(c.cash)}</td><td>${$$(c.card)}</td><td>${$$(c.qr)}</td><td>${$$(c.sold)}</td><td>${s.end&&d?$$(d):'—'}${s.editedBy?'<br><small>Corregido por '+e(s.editedBy)+'</small>':''}</td><td><b>${$$(c.sold+d)}</b></td>${JF()?`<td>${s.end?`<button class="bt s" data-a="sedit" data-i="${s.id}">Corregir</button>`:''}</td>`:''}</tr>`};
  V.innerHTML=(!jf&&cs?`<div class="card"><h3>Mi turno actual · Mostrador ${cs.counter}</h3><p style="color:var(--mut);margin:4px 0 12px">Entrada: ${fdt(cs.start)}</p>${cajaK(cs)}<button class="bt p" data-a="end">Cerrar turno y fichar salida</button></div>`:'')+(jf?`<div class="card"><h3>Caja de hoy (todos los turnos)</h3><div style="margin-top:12px">${cajaK(ag)}</div></div>`:'')+`<div class="card"><h3>${jf?'Turnos y cajas':'Mis turnos'}</h3>${table(['Empleado','Mostrador','Entrada','Salida','Ventas','Efectivo','Tarjeta','QR','Total vendido','Dif.','Total general',...(JF()?['']:[])],D.shifts.map(row),'Todavía no hay turnos registrados.')}</div>`}
 if(view=='stats'){const top={},pm={},mo={};D.sales.forEach(s=>{pm[PAY[s.payment]]=(pm[PAY[s.payment]]||0)+s.total;const k=dk(s.at).slice(0,7);mo[k]=(mo[k]||0)+s.total;s.items.forEach(i=>top[i.title]=(top[i.title]||0)+i.qty)});
  const bars=(o,f)=>{const a=Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,6),m=a[0]?a[0][1]:1;return a.map(([k,v])=>`<div class="hb"><span>${e(k)}</span><i style="width:${v/m*50}%"></i>${f(v)}</div>`).join('')||'<div class="em">Sin datos.</div>'},tot=sum(D.sales,s=>s.total);
  V.innerHTML=kp([['Ingresos totales',$$(tot)],['Ganancia total',$$(prof(D.sales))],['Ticket promedio',$$(tot/(D.sales.length||1))]])+`<div class="g2"><div class="card"><h3>Más vendidos (unidades)</h3>${bars(top,v=>v)}</div><div class="card"><h3>Ingresos por medio de pago</h3>${bars(pm,$$)}</div></div><div class="card"><h3>Ingresos por mes</h3>${bars(mo,$$)}</div>`}
 if(view=='team'){const os2=D.shifts.filter(s=>!s.end);
  V.innerHTML=`<div class="card"><h3>Equipo</h3>${table(['Usuario','Rol','Estado','Ventas',''],D.users.map(u=>{const o=os2.find(s=>s.userId==u.id);return`<tr><td><b>${e(u.name)}</b><br><small>@${e(u.username)}${u.email?' · '+e(u.email):''}</small></td><td><span class="tag ${u.role=='jefe'?'w':''}">${u.role=='jefe'?'Jefe':'Empleado'}</span></td><td>${u.role=='jefe'?'—':o?`En turno · Mostrador ${o.counter} desde ${fh(o.start)}`:'Fuera de turno'}</td><td>${D.sales.filter(s=>s.userId==u.id).length}</td><td>${u.id==D.me.id?'(vos)':`<button class="bt s" data-a="uedit" data-i="${u.id}">Editar</button> <button class="bt s" data-a="pw" data-i="${u.id}">Cambiar contraseña</button> <button class="bt s" data-a="role" data-i="${u.id}">${u.role=='jefe'?'Pasar a empleado':'Hacer jefe'}</button> <button class="bt s d" data-a="udel" data-i="${u.id}">Eliminar</button>`}</td></tr>`}),'')}</div><div class="card"><h3>Actividad</h3><div class="bar"><select id="lf"><option value="">Todos los usuarios</option>${D.users.map(u=>`<option value="${u.id}" ${u.id==lf?'selected':''}>${e(u.name)}</option>`).join('')}</select></div>${table(['Fecha y hora','Quién','Qué hizo'],D.log.filter(x=>!lf||x.userId==lf).slice(0,100).map(x=>`<tr><td>${fdt(x.at)}</td><td>${e(x.user)}</td><td>${e(x.text)}</td></tr>`),'Todavía no hay actividad registrada.')}</div>`}

 if(a=='gback'){GC=null;view='dash';load()}
 if(a=='gren'){const c=D.companies.find(x=>x.id==i);modal('Renombrar empresa',`<label>Nombre de la empresa</label><input id="gn" value="${e(c.name)}">`,async()=>{await api('admin/companies/'+i,'PUT',{name:$('#gn').value});await load();toast('Empresa actualizada.')})}
 if(a=='uedit'){const u=D.users.find(x=>x.id==i);modal('Editar usuario',`<label>Nombre completo</label><input id="un" value="${e(u.name)}"><label>Email (para recuperar la contraseña)</label><input id="ue" type="email" value="${e(u.email||'')}">`,async()=>{await api('users/'+i,'PUT',{name:$('#un').value,email:$('#ue').value});await load();toast('Usuario actualizado.')})}
 if(a=='mypw')modal('Cambiar mi contraseña',`<label>Contraseña actual</label><input id="pc" type="password" autocomplete="current-password"><label>Nueva contraseña (mínimo 8 caracteres)</label><input id="pn" type="password" autocomplete="new-password"><label>Repetir nueva contraseña</label><input id="pn2" type="password" autocomplete="new-password">`,async()=>{if($('#pn').value!=$('#pn2').value){toast('Las contraseñas no coinciden.',1);return false}await api('auth/password','POST',{current:$('#pc').value,password:$('#pn').value,confirm:$('#pn2').value});toast('Contraseña cambiada.')});
 if(a=='sedit'){const sh=D.shifts.find(x=>x.id==i),d=sh.diff||0;modal('Corregir cierre de caja',`<p style="color:var(--mut)">Cierre de ${e(sh.user)} · ${fdt(sh.end)}</p><label>Diferencia de caja</label><div class="bar"><select id="dt"><option value="ninguna" ${d==0?'selected':''}>Sin diferencia</option><option value="faltante" ${d<0?'selected':''}>Falta dinero</option><option value="sobrante" ${d>0?'selected':''}>Sobra dinero</option></select><input id="da" type="number" min="0" placeholder="Monto" value="${d?Math.abs(d):''}"></div><label>Nota (opcional)</label><input id="dn" value="${e(sh.diffNote||'')}">`,async()=>{await api('shift/'+i+'/diff','PUT',{diffType:$('#dt').value,diffAmount:+$('#da').value||0,note:$('#dn').value});await load();toast('Cierre corregido.')},'Guardar corrección')}
 if(a=='ct'){ct=i;saleForm()}
 if(a=='csel'){cid=+i;saleForm()}
 if(a=='udel')ask('¿Eliminar este usuario? Su historial de actividad se conserva.',async()=>{await api('users/'+i,'DELETE');await load();toast('Usuario eliminado.')});
});
document.addEventListener('input',ev=>{const g=ev.target.id;if(g=='q'){q=ev.target.value;tb()}if(g=='ps')fillRes();if(g=='cs')fillCs();if(g=='sq'){sq=ev.target.value;stk()}if(g=='mfq'){mfq=ev.target.value;mvs()}});
document.addEventListener('change',ev=>{if(ev.target.id=='mft'){mft=ev.target.value;mvs()}if(ev.target.id=='mty')$('#mql').textContent=ev.target.value=='ajuste'?'Stock real (cantidad contada)':'Cantidad';if(ev.target.id=='ce'){const c=D.clients.find(x=>(x.email||'').toLowerCase()==ev.target.value.trim().toLowerCase());if(c){const n=(c.name||'').split(' ');if(!$('#cf').value)$('#cf').value=c.firstName||n[0]||'';if(!$('#cl').value)$('#cl').value=c.lastName||n.slice(1).join(' ')}}if(ev.target.id=='tp'){tp=ev.target.value;tb()}if(ev.target.id=='lf'){lf=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.closest('.auth')&&ev.target.tagName=='INPUT')doAuth()});
if(RT){D=null;render()}else load();
</script></body></html>

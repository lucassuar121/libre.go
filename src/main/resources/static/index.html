<style>

.qi{width:76px;flex:0 0 76px;text-align:center;padding:6px}

.ld-sec{padding:64px 0}.ld-sec h2{font-size:clamp(24px,3.5vw,34px);text-align:center;margin-bottom:8px}.ld-sec .sub{text-align:center;color:var(--mut);margin:0 auto 36px;max-width:640px}
.ld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.ld-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.ld-card h3{font-size:18px;margin-bottom:6px}.ld-card p{margin:0;color:var(--mut);font-size:14.5px}
.ld-card .n{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border-radius:10px;background:var(--pri2);color:var(--pri);font-weight:700;margin-bottom:10px}
.ld-alt{background:var(--card);border-block:1px solid var(--line)}
.ld-plan{max-width:420px;margin:0 auto;background:var(--card);border:2px solid var(--pri);border-radius:18px;padding:28px;text-align:center}
.ld-price{font-size:30px;font-family:Georgia,serif;margin:10px 0}.ld-price small{font-size:14px;color:var(--mut)}
.ld-plan ul{list-style:none;padding:0;margin:16px 0 22px;text-align:left}.ld-plan li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--line)}.ld-plan li:before{content:'✓';position:absolute;left:0;color:var(--pri);font-weight:700}
.ld-band{background:#0f4c4a;color:#fff;text-align:center;padding:48px 24px}.ld-band h2{color:#fff;margin-bottom:16px;font-size:clamp(22px,3vw,30px)}
.ld-foot{padding:24px;text-align:center;color:var(--mut);font-size:14px}
@media(max-width:820px){.ld-hg{grid-template-columns:1fr}.ld-w{padding:0 16px}}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:16px}#bg{display:inline-block}.g2{grid-template-columns:1fr}}
@media print{aside,main,#au,.noprint,.ts{display:none!important}body{background:#fff}.ov{position:static;background:none;padding:0;display:block}.md{box-shadow:none;max-width:none;max-height:none;overflow:visible;padding:0;background:#fff}.md>h3{display:none}.tkt{border:0}}
</style></head><body>
<aside id="sd"><h1>Libre<span>.go</span></h1>
<button class="nv" data-a="nav" data-i="dash">Panel</button><button class="nv" data-a="nav" data-i="products">Productos</button><button class="nv" data-a="nav" data-i="sales">Ventas</button><button class="nv" data-a="nav" data-i="stock">Stock</button><button class="nv" data-a="nav" data-i="caja">Caja</button><button class="nv" data-a="nav" data-i="clients">Clientes</button><button class="nv" data-a="nav" data-i="suppliers">Proveedores</button><button class="nv jf" data-a="nav" data-i="compras">Compras</button><button class="nv jf" data-a="nav" data-i="stats">Estadísticas</button><button class="nv jf" data-a="nav" data-i="team">Equipo y actividad</button><button class="nv jf" data-a="nav" data-i="turnos">Configuración de turnos</button><button class="nv jf" data-a="nav" data-i="sub">Suscripción</button>
<div id="me" style="margin-top:auto;padding:10px;font-size:13px"></div></aside>
<main><div class="top"><button class="bt" id="bg" data-a="menu" aria-label="Abrir menú">☰</button><h2 id="ttl"></h2><span id="act"></span></div><div id="sb"></div><div id="v"></div></main>
<div id="m"></div><div id="au"></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
let TZ;

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),MT={entrada:'Entrada de mercadería',venta:'Salida por venta',salida:'Salida',ajuste:'Ajuste de stock',devolucion:'Devolución',in:'Entrada',out:'Salida'};
const pad=n=>String(n).padStart(5,'0'),MIN=5,PAY={efectivo:'Efectivo',tarjeta:'Tarjeta',qr:'QR'};
const T={dash:'Panel',products:'Productos',sales:'Ventas',stock:'Stock',caja:'Caja',clients:'Clientes',suppliers:'Proveedores',stats:'Estadísticas',team:'Equipo y actividad',turnos:'Configuración de turnos',sub:'Suscripción',compras:'Compras'};
let D=null,view='dash',am='login',q='',tp='',lf='',cart=[],pay='',scl='',sp='month',sv={day:'',month:'',year:''},stn=10,sfd='',sft='',sfc='',scr=(location.hash=='#login'?'auth':'land'),bm='u',ct='nuevo',cid=null,csq='',cu={fn:'',ln:'',em:''},psq='',GC=null,stab='stock',sq='',mfq='',mft='',mfd='',cfd='',ssq='',pd='',ps2='',pn='',pcart=[],pf={s:'',d:'',i:'',n:'',rid:''},ppq='',RT=new URLSearchParams(location.search).get('reset'),CONTRATACION=new URLSearchParams(location.search).get('contratacion'),PAGO=new URLSearchParams(location.search).get('pago'),pollN=0,PRICE=null;
const JF=()=>D.me.role=='jefe',pr=id=>D.products.find(p=>p.id==id)||{title:'(eliminado)',sellPrice:0,stock:0};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',...(GC?{'X-Company':GC}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(x){}if(!r.ok){const er=new Error(j.message||'Ocurrió un error. Probá de nuevo.');er.st=r.status;if(r.status==402&&p!='bootstrap')setTimeout(load,0);throw er}return j}
function toast(t,bad){const d=document.createElement('div');d.className='ts'+(bad?' bad':'');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3800)}
function setD(d){if(d.tz)TZ=d.tz;['sales','moves','shifts'].forEach(k=>(d[k]=d[k]||[]).sort((a,b)=>b.id-a.id));D=d;render()}
async function load(){try{setD(await api('bootstrap'))}catch(x){if(GC&&x.st!=401){GC=null;return load()}D=null;render()}}
const run=async(f,ok)=>{try{await f();if(ok)toast(ok)}catch(x){if(x.st==401){D=null;scr='auth';render()}toast(x.message,1)}};
function modal(t,body,ok,label,mode){$('#m').innerHTML=`<div class="ov"><div class="md" role="dialog" aria-label="${e(t)}"><h3>${e(t)}</h3>${body}${mode==2?'':`<div class="ra noprint">${mode==1?'':`<button class="bt" data-a="close">${ok?'Cancelar':'Cerrar'}</button>`}${ok?`<button class="bt p" id="ok">${label||'Guardar'}</button>`:''}</div>`}</div></div>`;
 if(ok)$('#ok').onclick=async()=>{const b=$('#ok');b.disabled=true;try{if(await ok()!==false)$('#m').innerHTML=''}catch(x){if(x.st==401){D=null;scr='auth';render()}else toast(x.message,1)}if(b.isConnected)b.disabled=false}}
const ask=(t,f)=>modal('Confirmar',`<p>${e(t)}</p>`,f,'Sí, eliminar');
const wl=u=>{u=(u||'').trim();if(!u)return '—';const h=/^https?:\/\//i.test(u)?u:'https://'+u;return `<a href="${e(h)}" target="_blank" rel="noopener noreferrer">${e(u)}</a>`};
const table=(h,rows,empty)=>rows.length?`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:`<div class="em">${empty}</div>`;
const acts=(k,id,del=1)=>`<button class="bt s" data-a="edit" data-k="${k}" data-i="${id}">Editar</button>${del?` <button class="bt s d" data-a="del" data-k="${k}" data-i="${id}">Eliminar</button>`:''}`;
const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0),prof=l=>sum(l,s=>sum(s.items,i=>(i.price-(i.cost||0))*i.qty)),low=()=>D.products.filter(p=>p.stock<=MIN);
const kp=a=>`<div class="kp">${a.map(x=>`<div class="card"><small>${x[0]}</small><b${x[2]?` style="color:${x[2]}"`:''}>${x[1]}</b></div>`).join('')}</div>`;
const cajaK=sh=>{const c=sh.cash,d=sh.end?sh.diff||0:0;return kp([['Total vendido',$$(c.sold)],['Cobrado en efectivo',$$(c.cash)],['Cobrado con tarjeta',$$(c.card)],['Cobrado con QR',$$(c.qr)],['Ventas realizadas',c.count],['Faltante / sobrante',sh.end?(d==0?'Sin diferencia':(d>0?'Sobrante ':'Faltante ')+$$(Math.abs(d))):'Se carga al cerrar',d<0?'var(--bad)':''],['Total general de la caja',$$(c.sold+d)]])};
const salesTable=(l,tk=1)=>table(['N°','Fecha y hora','Cliente','Empleado','Turno','Pago','Total',''],l.map(s=>`<tr><td>#${pad(s.number)}</td><td>${fdt(s.at)}</td><td>${e(s.clientName)}</td><td>${e(s.user)}${s.counter?`<br><small>Mostrador ${s.counter}</small>`:''}</td><td>${e(s.shiftName||'—')}</td><td>${PAY[s.payment]||''}</td><td>${$$(s.total)}</td><td>${tk?`<button class="bt s" data-a="tk" data-i="${s.id}">Ver ticket</button>`:''}</td></tr>`),'Todavía no hay ventas.');

function render(){
 if(!D){document.body.classList.add('out');$('#m').innerHTML='';return authView()}
 document.body.classList.remove('out');$('#au').innerHTML='';
 if(D.blocked)return blockedView();
 if(PAGO){PAGO=null;history.replaceState(null,'',location.pathname)}
 if(D.me.role=='global'&&!GC){document.querySelectorAll('.nv').forEach(n=>n.style.display='none');$('#ttl').textContent='Administración Global';$('#act').innerHTML='';$('#me').innerHTML=meBox();$('#v').innerHTML=gview();return}
 const jf=JF(),os=D.openShift;
 if(!jf&&['stats','team','turnos','sub','compras'].includes(view))view='dash';
 document.querySelectorAll('.nv').forEach(n=>{n.classList.toggle('on',n.dataset.i==view);n.style.display=n.classList.contains('jf')&&!jf?'none':''});
 $('#ttl').textContent=T[view]+(GC?' · '+D.company:'');
 $('#me').innerHTML=meBox();
 $('#sb').innerHTML=D.subscription&&D.subscription.warn?`<div class="card" style="border-color:var(--acc)"><b>${D.subscription.cancelRequested?'Tu acceso termina':'Tu suscripción vence'} ${D.subscription.daysLeft<=0?'hoy':D.subscription.daysLeft==1?'mañana':'en '+D.subscription.daysLeft+' días'}.</b> ${D.subscription.cancelRequested?'Después de esa fecha se eliminarán los datos de tu empresa.':'Activá la renovación automática para no perder el acceso.'} ${D.gadmin?'':`<button class="bt s p" data-a="subpay">${D.subscription.cancelRequested?'Volver a suscribirme':'Activar renovación automática'}</button>`}</div>`:'';
 const A={products:'<button class="bt p" data-a="add" data-k="products">Nuevo producto</button>',clients:'<button class="bt p" data-a="add" data-k="clients">Nuevo cliente</button>',suppliers:'<button class="bt p" data-a="add" data-k="suppliers">Nuevo proveedor</button>',sales:'<button class="bt p" data-a="sale">Nueva venta</button>',stock:'<button class="bt" data-a="move">Movimiento de stock</button> <button class="bt p" data-a="add" data-k="products">Ingresar producto nuevo</button>',team:jf?'<button class="bt p" data-a="nu">Nuevo usuario</button>':'',turnos:jf?'<button class="bt p" data-a="tdnew">Nuevo turno</button>':'',compras:jf?'<button class="bt p" data-a="pnew">Nueva compra</button>':''};
 $('#act').innerHTML=A[view]||'';
 const V=$('#v');
 if(view=='dash'){const td=dk(Date.now()),mo=td.slice(0,7),st=D.sales.filter(s=>dk(s.at)==td),sm=D.sales.filter(s=>dk(s.at).slice(0,7)==mo),L=low();
  const k=[['Ventas de hoy',st.length],['Productos',D.products.length],['Con poco stock',L.length,'var(--bad)']];

 if(a=='subpay')modal('Suscribirme con Mercado Pago',`<p style="color:var(--mut)">Vas a autorizar un cobro mensual de ${$$(D.subscription.price)} que se renueva automáticamente. Podés darte de baja cuando quieras desde la sección Suscripción.</p><label>Email de tu cuenta de Mercado Pago</label><input id="pme" type="email" value="${e(D.me.email||'')}">`,async()=>{const r=await api('subscription/checkout','POST',{payerEmail:$('#pme').value.trim()});location.href=r.url;return false},'Continuar a Mercado Pago');
 if(a=='subcancel'){const s=D.subscription;modal('Dar de baja la suscripción',`<p>Se cancela la renovación automática en Mercado Pago y no se generan más cobros.</p><p><b>Vas a poder usar la aplicación hasta el ${fdate(s.expires)}.</b> Después de esa fecha, tu empresa y todos sus datos se eliminarán y no se pueden recuperar.</p>`,async()=>{const r=await api('subscription/cancel','POST',{confirm:true});await load();toast('Baja registrada. Tenés acceso hasta el '+fdate(r.accessUntil)+'.')},'Sí, dar de baja')}
 if(a=='subref')load();
 if(a=='gsub'){const c=D.companies.find(x=>x.id==i);modal('Suscripción · '+c.name,`<p>Estado: <b>${SUBL[c.subStatus]||'—'}</b>${c.subExpires?' · vence '+fdate(c.subExpires):''}</p><p style="color:var(--mut);font-size:14px">Acciones manuales del administrador global. Quedan registradas en el historial de pagos como "Manual".</p><div class="bar"><button class="bt p" data-a="gsa" data-i="${i}" data-k="activate">Activar / extender 1 mes</button><button class="bt" data-a="gsa" data-i="${i}" data-k="expire">Marcar vencida</button><button class="bt" data-a="gsa" data-i="${i}" data-k="pending">Marcar pendiente de pago</button></div>`,null)}

 if(a=='cfclr'){cfd='';render()}
 if(a=='ssclr'){ssq='';render()}
 if(a=='pclr'){pd='';ps2='';pn='';render()}

document.addEventListener('input',ev=>{const g=ev.target.id;if(g=='q'){q=ev.target.value;tb()}if(g=='ps')fillRes();if(g=='cs')fillCs();if(g=='bq'||g=='bp')boxTot();if(g=='ssq'){ssq=ev.target.value;spl()}if(g=='pfn2'){pn=ev.target.value;purTb()}if(g=='pps')purRes();if(g=='sq'){sq=ev.target.value;stk()}if(g=='mfq'){mfq=ev.target.value;mvs()}});
document.addEventListener('change',ev=>{if(ev.target.id=='mfd'){mfd=ev.target.value;mvs()}if(ev.target.id=='cfd'){cfd=ev.target.value;render()}if(ev.target.id=='pfd2'){pd=ev.target.value;purTb()}if(ev.target.id=='pfs2'){ps2=ev.target.value;purTb()}if(ev.target.dataset&&ev.target.dataset.pq!==undefined){pcart[+ev.target.dataset.pq].q=ev.target.value;purForm()}if(ev.target.dataset&&ev.target.dataset.pp!==undefined){pcart[+ev.target.dataset.pp].price=ev.target.value;purForm()}{const id=ev.target.id,v=ev.target.value;if(id=='sfd'){sfd=v;render()}else if(id=='sft'){sft=v;render()}else if(id=='sfc'){sfc=v;render()}else if(id=='sdv'){sv[sp]=v;render()}else if(id=='stn'){stn=+v;render()}}if(ev.target.dataset&&ev.target.dataset.ci!==undefined)setQty(+ev.target.dataset.ci,ev.target.value);if(ev.target.id=='mft'){mft=ev.target.value;mvs()}if(ev.target.id=='mty')$('#mql').textContent=ev.target.value=='ajuste'?'Stock real (cantidad contada)':'Cantidad';if(ev.target.id=='mty'){const en=ev.target.value=='entrada';$('#bmw').style.display=en?'':'none';if(!en)setBm('u')}if(ev.target.id=='ce'){const c=D.clients.find(x=>(x.email||'').toLowerCase()==ev.target.value.trim().toLowerCase());if(c){const n=(c.name||'').split(' ');if(!$('#cf').value)$('#cf').value=c.firstName||n[0]||'';if(!$('#cl').value)$('#cl').value=c.lastName||n.slice(1).join(' ')}}if(ev.target.id=='tp'){tp=ev.target.value;tb()}if(ev.target.id=='lf'){lf=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='ps'){const f=document.querySelector('.qa');if(f){ev.preventDefault();f.focus();f.select()}}if(ev.key=='Enter'&&ev.target.classList&&ev.target.classList.contains('qa')){ev.preventDefault();addCart(ev.target.dataset.p,ev.target.value)}if(ev.key=='Enter'&&ev.target.closest('.auth')&&ev.target.tagName=='INPUT'){if(CONTRATACION)doSignupRegister();else if(!RT&&scr=='contact')doCheckout();else doAuth()}});
fetch('/api/public/plan').then(r=>r.json()).then(j=>{if(j&&j.price){PRICE=j.price;if(!D&&scr=='land')render()}}).catch(()=>{});
if(RT||CONTRATACION){D=null;render()}else load();
</script></body></html>

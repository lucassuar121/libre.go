spring.web.resources.cache.cachecontrol.no-cache=true
server.port=${PORT:8080}
# Los errores inesperados NO devuelven detalles internos al cliente (los errores propios envían su mensaje desde Api.rse).
server.error.include-message=never
server.error.include-stacktrace=never
# Cierre ordenado al recibir SIGTERM (Cloud Run)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/librego;AUTO_SERVER=TRUE}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ===== Perfiles =====
# Sin perfil = DESARROLLO LOCAL con H2 (archivo ./data). En producción se activa el perfil "prod"
# (SPRING_PROFILES_ACTIVE=prod, ya incluido en el Dockerfile): usa PostgreSQL. Ver application-prod.properties.

# CORS (solo si el frontend se publica en otro dominio). Lista separada por comas, por ejemplo https://app.tudominio.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Desarrollo: si el email no está configurado, se muestra su contenido en la consola. En producción es false (application-prod.properties).
app.mail.log-content=true

# URL pública de la app: se usa para armar el enlace del email de recuperación
app.base-url=${BASE_URL:http://localhost:8080}
app.timezone=America/Argentina/Cordoba
# Minutos de validez del enlace de recuperación de contraseña
app.reset-minutes=30

# Email (opcional) donde llega un aviso cuando una empresa completa el formulario "Quiero contratar"
app.contact-email=${CONTACT_EMAIL:}

# Administrador global. La contraseña NO tiene valor por defecto: se toma de la variable GLOBAL_ADMIN_PASSWORD.
# Solo se usa cuando el usuario se crea por primera vez (después se cambia desde "Mi contraseña").
# En producción es obligatoria (mínimo 12 caracteres) si el usuario todavía no existe.
app.global-admin.username=lucas1
app.global-admin.password=${GLOBAL_ADMIN_PASSWORD:}

# Gmail (SMTP). Las credenciales NO van en el código: se leen de variables de entorno.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ===== Suscripción mensual =====
# Precio mensual en pesos argentinos. ES EL ÚNICO LUGAR donde se define (la pantalla y los pagos lo leen del servidor).
app.subscription.price=${SUBSCRIPTION_PRICE:30000}
app.subscription.title=Suscripci\u00f3n mensual Libre.go
# Días de anticipación para avisarle al jefe que la suscripción está por vencer
app.subscription.warn-days=7
# Empresas creadas ANTES de la suscripción: 0 = quedan PENDIENTE_PAGO; N>0 = quedan ACTIVAS durante N días (solo una vez, al migrar)
app.subscription.grandfather-days=${SUBSCRIPTION_GRANT_EXISTING_DAYS:0}

# Días de gracia entre el vencimiento del último período pagado y la eliminación de una empresa dada de baja (0 = al vencer).
app.subscription.delete-grace-days=${SUBSCRIPTION_DELETE_GRACE_DAYS:0}

# ===== Tareas automáticas (revocar acceso vencido, eliminar bajas vencidas) =====
app.jobs.enabled=${JOBS_ENABLED:true}
app.jobs.interval-ms=3600000
app.jobs.initial-delay-ms=60000
# Token secreto para que Cloud Scheduler pueda ejecutar las tareas llamando a POST /api/internal/jobs/run (encabezado X-Jobs-Token).
# Si está vacío ese endpoint queda deshabilitado (solo corre la tarea interna).
app.jobs.token=${JOBS_TOKEN:}

# ===== Mercado Pago (suscripciones con renovación automática) =====
# >>> AQUÍ SE CONFIGURA MERCADO PAGO con variables de entorno. Nunca escribas las credenciales en este archivo.
# Access Token de tu aplicación de Mercado Pago (credenciales de PRODUCCIÓN o de PRUEBA, según corresponda)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# Public Key (no se usa con Checkout Pro por redirección; queda disponible para futuras integraciones)
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
# URL pública y completa del webhook, por ejemplo https://tu-dominio.com/api/mercadopago/webhook
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
# "Clave secreta" de las notificaciones (Webhooks) del panel de Mercado Pago. Recomendado: valida la firma de cada aviso.
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# true = redirige a la URL de pruebas (sandbox_init_point) cuando Mercado Pago la devuelve
mercadopago.sandbox=${MERCADOPAGO_SANDBOX:false}

# Clave AES-256 (Base64 de 32 bytes aleatorios) para cifrar certificados y contraseñas fiscales por empresa.
# En producción configurarla como secreto ARCA_ENCRYPTION_KEY. Nunca guardarla en Git.
arca.encryption-key=${ARCA_ENCRYPTION_KEY:}
arca.allow-production=${ARCA_ALLOW_PRODUCTION:false}


# Cuentas demo: valores predeterminados solo para desarrollo local; en producción cambiá ambas contraseñas.
demo.boss.username=${DEMO_BOSS_USERNAME:demo_jefe}
demo.boss.password=${DEMO_BOSS_PASSWORD:DemoJefe2026!}
demo.employee.username=${DEMO_EMPLOYEE_USERNAME:demo_empleado}
demo.employee.password=${DEMO_EMPLOYEE_PASSWORD:DemoEmpleado2026!}

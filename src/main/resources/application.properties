server.port=${PORT:8080}
server.error.include-message=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/librego;AUTO_SERVER=TRUE}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URL pública de la app: se usa para armar el enlace del email de recuperación
app.base-url=${BASE_URL:http://localhost:8080}
app.timezone=America/Argentina/Cordoba
# Minutos de validez del enlace de recuperación de contraseña
app.reset-minutes=30

# Administrador global. La contraseña inicial se puede cambiar con la variable GLOBAL_ADMIN_PASSWORD
# (solo se usa cuando el usuario se crea por primera vez; después se cambia desde "Mi contraseña").
app.global-admin.username=lucas1
app.global-admin.password=${GLOBAL_ADMIN_PASSWORD:}

# Gmail (SMTP). Las credenciales NO van en el código: se leen de variables de entorno.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
